<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Type Race has moved to typebattle.fun</title>
    <meta name="robots" content="noindex" />
    <!-- Type Race now lives at its own domain. Redirect there, preserving the
         hash (and query) so old share links like /typebattle/#/race/<id> land
         in the right race. -->
    <link rel="canonical" href="https://typebattle.fun/" />
    <meta http-equiv="refresh" content="0; url=https://typebattle.fun/" />
    <script>
      location.replace('https://typebattle.fun/' + location.search + location.hash);
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0c1f35; color: #e8eef5;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center; padding: 24px;
      }
      a { color: #39c2c9; }
    </style>
  </head>
  <body>
    <p>
      ⌨️ Type Race has moved to
      <a href="https://typebattle.fun/">typebattle.fun</a>.<br />
      Redirecting you now…
    </p>
  </body>
</html>
