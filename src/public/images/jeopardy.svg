<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f6b"/>
      <stop offset="100%" stop-color="#05103f"/>
    </linearGradient>
    <linearGradient id="jcell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1436a8"/>
      <stop offset="100%" stop-color="#0a2178"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#jbg)"/>

  <!-- Board grid: 4 columns x 4 rows -->
  <g stroke="#05103f" stroke-width="6">
    <g fill="url(#jcell)">
      <rect x="20"  y="112" width="82" height="62" rx="4"/>
      <rect x="110" y="112" width="82" height="62" rx="4"/>
      <rect x="200" y="112" width="82" height="62" rx="4"/>
      <rect x="290" y="112" width="82" height="62" rx="4"/>

      <rect x="20"  y="182" width="82" height="62" rx="4"/>
      <rect x="110" y="182" width="82" height="62" rx="4"/>
      <rect x="200" y="182" width="82" height="62" rx="4"/>
      <rect x="290" y="182" width="82" height="62" rx="4"/>

      <rect x="20"  y="252" width="82" height="62" rx="4"/>
      <rect x="110" y="252" width="82" height="62" rx="4"/>
      <rect x="200" y="252" width="82" height="62" rx="4"/>
      <rect x="290" y="252" width="82" height="62" rx="4"/>

      <rect x="20"  y="322" width="82" height="62" rx="4"/>
      <rect x="110" y="322" width="82" height="62" rx="4"/>
      <rect x="200" y="322" width="82" height="62" rx="4"/>
      <rect x="290" y="322" width="82" height="62" rx="4"/>
    </g>
  </g>

  <!-- Dollar values -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#f0b323" text-anchor="middle">
    <g font-size="30">
      <text x="61"  y="155">$100</text>
      <text x="151" y="155">$100</text>
      <text x="241" y="155">$100</text>
      <text x="331" y="155">$100</text>

      <text x="61"  y="225">$200</text>
      <text x="151" y="225">$200</text>
      <text x="241" y="225">$200</text>
      <text x="331" y="225">$200</text>

      <text x="61"  y="295">$300</text>
      <text x="151" y="295">$300</text>
      <text x="241" y="295">$300</text>
      <text x="331" y="295">$300</text>

      <text x="61"  y="365">$400</text>
      <text x="151" y="365">$400</text>
      <text x="241" y="365">$400</text>
      <text x="331" y="365">$400</text>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="200" y="72" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="2">JEOPARDY!</text>
  </g>
</svg>
