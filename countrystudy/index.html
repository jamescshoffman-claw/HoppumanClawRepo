<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #f1f5f9;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }
    .tab-btn {
      padding: 8px 32px;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .tab-btn:hover { border-color: #4ade80; color: #f1f5f9; }
    .tab-btn.active { background: #15803d; border-color: #16a34a; color: #fff; }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      line-height: 1;
    }
    .score .num { color: #4ade80; }
    .score .sep { color: #475569; }
    .score .den { color: #f1f5f9; }
    .score .lbl { color: #94a3b8; font-size: 1rem; font-weight: normal; margin-left: 4px; }

    .prog-wrap { width: 240px; }
    .prog-bg {
      background: #1e293b;
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 999px;
    }
    .prog-label {
      text-align: right;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }

    /* ── Input + buttons row ── */
    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    #country-input {
      width: 300px;
      max-width: 60vw;
      padding: 12px 22px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #country-input::placeholder { color: #475569; }
    #country-input:focus { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.15); }
    #country-input.correct { border-color: #4ade80; }
    #country-input.wrong { border-color: #f87171; animation: shake 0.35s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    .feedback {
      text-align: center;
      height: 22px;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    /* ── Win banner ── */
    .win-banner {
      display: none;
      text-align: center;
      padding: 14px;
      background: linear-gradient(135deg, #14532d, #166534);
      border-radius: 10px;
      color: #86efac;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* ── Map ── */
    #map-wrap {
      background: #0c1f35;
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 20px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.5);
    }
    svg { width: 100%; height: auto; display: block; }

    .country-path {
      fill: #2d4a6b;
      stroke: #0c1f35;
      stroke-width: 0.6;
      cursor: default;
      transition: fill 0.4s ease;
    }
    .country-path:hover { fill: #3d5a7b; }
    .country-path.found { fill: #15803d; }
    .country-path.found:hover { fill: #22c55e; }

    /* ── Found tags ── */
    .found-section { display: none; }
    .found-section h3 {
      color: #64748b;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
    }
    .found-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: #14532d;
      border: 1px solid #166534;
      color: #86efac;
      padding: 3px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    /* ── Give Up / Restart buttons ── */
    #give-up-btn, #restart-btn {
      padding: 11px 18px;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    #give-up-btn {
      border: 2px solid #7f1d1d;
      background: transparent;
      color: #fca5a5;
    }
    #give-up-btn:hover { background: #7f1d1d; color: #fff; }
    #give-up-btn:disabled { opacity: 0.4; cursor: default; }
    #restart-btn {
      display: none;
      border: 2px solid #1e40af;
      background: transparent;
      color: #93c5fd;
    }
    #restart-btn:hover { background: #1e40af; color: #fff; }

    /* ── Missed countries (shown on give-up) ── */
    .country-path.missed { fill: #9f1239; }
    .country-path.missed:hover { fill: #e11d48; }

    /* ── Missed tags section ── */
    .missed-section { display: none; margin-top: 16px; }
    .missed-section h3 {
      color: #64748b;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
    }
    .missed-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .missed-tag {
      background: #4c0519;
      border: 1px solid #9f1239;
      color: #fda4af;
      padding: 3px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Countries Quiz</h1>

  <div class="tabs">
    <button class="tab-btn active" data-region="europe">Europe</button>
    <button class="tab-btn" data-region="asia">Asia</button>
  </div>

  <div class="stats">
    <div class="score">
      <span class="num" id="score-num">0</span>
      <span class="sep"> / </span>
      <span class="den" id="score-den">49</span>
      <span class="lbl">countries</span>
    </div>
    <div class="prog-wrap">
      <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-label" id="prog-label">0%</div>
    </div>
  </div>

  <div class="input-row">
    <input
      id="country-input"
      type="text"
      placeholder="Type a country name…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />
    <button id="give-up-btn">Give Up</button>
    <button id="restart-btn">Restart</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="win-banner" id="win-banner"></div>

  <div id="map-wrap">
    <svg id="map" viewBox="0 0 960 600"></svg>
  </div>

  <div class="found-section" id="found-section">
    <h3>Found (<span id="found-count">0</span>)</h3>
    <div class="found-tags" id="found-tags"></div>
  </div>

  <div class="missed-section" id="missed-section">
    <h3>Missed (<span id="missed-count">0</span>)</h3>
    <div class="missed-tags" id="missed-tags"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function () {

  const EUROPE_SMALL_DEF = [
    { id: 20,  lon: 1.58,  lat: 42.55, dx: -48, dy: -22 }, // Andorra
    { id: -99, lon: 20.90, lat: 42.58, dx:  55, dy: -30 }, // Kosovo
    { id: 438, lon: 9.55,  lat: 47.17, dx: -50, dy: -22 }, // Liechtenstein
    { id: 470, lon: 14.37, lat: 35.90, dx:  50, dy:  22 }, // Malta
    { id: 492, lon: 7.40,  lat: 43.74, dx:  50, dy: -22 }, // Monaco
    { id: 674, lon: 12.46, lat: 43.93, dx:  50, dy: -22 }, // San Marino
    { id: 336, lon: 12.45, lat: 41.90, dx:  50, dy:  22 }, // Vatican City
  ];

  const ASIA_COUNTRIES = [
    { id: 4,   name: "Afghanistan" },
    { id: 51,  name: "Armenia" },
    { id: 31,  name: "Azerbaijan" },
    { id: 48,  name: "Bahrain" },
    { id: 50,  name: "Bangladesh" },
    { id: 64,  name: "Bhutan" },
    { id: 96,  name: "Brunei",             aliases: ["Brunei Darussalam"] },
    { id: 116, name: "Cambodia" },
    { id: 156, name: "China" },
    { id: 268, name: "Georgia" },
    { id: 356, name: "India" },
    { id: 360, name: "Indonesia" },
    { id: 364, name: "Iran" },
    { id: 368, name: "Iraq" },
    { id: 376, name: "Israel" },
    { id: 392, name: "Japan" },
    { id: 400, name: "Jordan" },
    { id: 398, name: "Kazakhstan" },
    { id: 414, name: "Kuwait" },
    { id: 417, name: "Kyrgyzstan" },
    { id: 418, name: "Laos" },
    { id: 422, name: "Lebanon" },
    { id: 458, name: "Malaysia" },
    { id: 462, name: "Maldives" },
    { id: 496, name: "Mongolia" },
    { id: 104, name: "Myanmar",            aliases: ["Burma"] },
    { id: 524, name: "Nepal" },
    { id: 408, name: "North Korea" },
    { id: 512, name: "Oman" },
    { id: 586, name: "Pakistan" },
    { id: 608, name: "Philippines" },
    { id: 634, name: "Qatar" },
    { id: 682, name: "Saudi Arabia" },
    { id: 702, name: "Singapore" },
    { id: 410, name: "South Korea",        aliases: ["Korea"] },
    { id: 144, name: "Sri Lanka",          aliases: ["Ceylon"] },
    { id: 760, name: "Syria" },
    { id: 158, name: "Taiwan" },
    { id: 762, name: "Tajikistan" },
    { id: 764, name: "Thailand" },
    { id: 626, name: "Timor-Leste",        aliases: ["East Timor"] },
    { id: 792, name: "Turkey" },
    { id: 795, name: "Turkmenistan" },
    { id: 784, name: "United Arab Emirates", aliases: ["UAE"] },
    { id: 860, name: "Uzbekistan" },
    { id: 704, name: "Vietnam",            aliases: ["Viet Nam"] },
    { id: 887, name: "Yemen" },
  ];

  const ASIA_SMALL_DEF = [
    { id: 48,  lon: 50.55,  lat: 26.00, dx:  55, dy: -25 }, // Bahrain
    { id: 96,  lon: 114.83, lat:  4.94, dx:  50, dy: -28 }, // Brunei
    { id: 462, lon: 73.50,  lat:  4.00, dx: -55, dy: -20 }, // Maldives
    { id: 634, lon: 51.20,  lat: 25.30, dx:  55, dy:  25 }, // Qatar
    { id: 702, lon: 103.82, lat:  1.35, dx:  50, dy: -25 }, // Singapore
  ];

  // ── Configs ───────────────────────────────────────────────────────────────

  const CONFIGS = {
    europe: {
      countries:   EUROPE_COUNTRIES,
      smallDef:    EUROPE_SMALL_DEF,
      total:       49,
      projCenter:  [15, 53],
      projScale:   600,
      regionLabel: 'European',
      winMsg:      '🎉 Amazing! You named all 49 countries of Europe!',
    },
    asia: {
      countries:   ASIA_COUNTRIES,
      smallDef:    ASIA_SMALL_DEF,
      total:       47,
      projCenter:  [88, 30],
      projScale:   280,
      regionLabel: 'Asian',
      winMsg:      '🎉 Amazing! You named all 47 countries of Asia!',
    },
  };

  // ── Shared module state (reset by initQuiz) ───────────────────────────────

  const W = 960, H = 600;
  let lookup       = new Map();
  let found        = new Set();
  let TOTAL        = 0;
  let COUNTRIES_LIST = [];
  let SMALL_DEF_CUR  = [];
  let SMALL_IDS      = new Set();
  let featureMap     = new Map();
  let proj           = null;
  let geoPath        = null;
  let foundLabelsG   = null;
  let missedLabelsG  = null;
  let calloutG       = null;
  let gameOver       = false;
  let regionLabel    = '';
  let winMsg         = '';
  let quizVersion    = 0;
  let fbTimer;

  const input = document.getElementById('country-input');

  // Prevent page scroll when wheeling over the map (attached once)
  document.getElementById('map').addEventListener('wheel', e => e.preventDefault(), { passive: false });

  // ── Utilities ─────────────────────────────────────────────────────────────

  const safeId = id => String(id).replace('-', 'n');
  const cpId   = id => `cp-${safeId(id)}`;

  function setFeedback(msg, color) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.style.color  = color;
    clearTimeout(fbTimer);
    fbTimer = setTimeout(() => { el.textContent = ''; }, 1800);
  }

  function updateProgress() {
    const pct = Math.round((found.size / TOTAL) * 100);
    document.getElementById('score-num').textContent  = found.size;
    document.getElementById('prog-fill').style.width  = pct + '%';
    document.getElementById('prog-label').textContent = pct + '%';
  }

  function addMapLabel(country, group, color) {
    if (SMALL_IDS.has(country.id)) {
      const sc = SMALL_DEF_CUR.find(s => s.id === country.id);
      if (!sc) return;
      const [px, py] = proj([sc.lon, sc.lat]);
      const lx = px + sc.dx, ly = py + sc.dy;
      const g = d3.select(`#callout-${safeId(country.id)}`);
      g.select('line').attr('stroke', color);
      g.select('circle').attr('fill', color);
      g.append('text')
        .attr('x', lx).attr('y', ly)
        .attr('text-anchor', sc.dx > 0 ? 'start' : 'end')
        .attr('dominant-baseline', 'middle')
        .attr('font-size', '7.5px')
        .attr('font-weight', 'bold')
        .attr('font-family', 'Segoe UI, Tahoma, sans-serif')
        .attr('fill', color)
        .attr('stroke', 'rgba(0,0,0,0.8)')
        .attr('stroke-width', '2')
        .style('paint-order', 'stroke fill')
        .attr('pointer-events', 'none')
        .text(country.name);
    } else {
      const feature = featureMap.get(country.id);
      if (!feature) return;
      const [cx, cy] = geoPath.centroid(feature);
      if (isNaN(cx) || isNaN(cy) || cx < 0 || cx > W || cy < 0 || cy > H) return;
      group.append('text')
        .attr('x', cx).attr('y', cy)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('font-size', '8px')
        .attr('font-weight', 'bold')
        .attr('font-family', 'Segoe UI, Tahoma, sans-serif')
        .attr('pointer-events', 'none')
        .attr('fill', color)
        .attr('stroke', 'rgba(0,0,0,0.75)')
        .attr('stroke-width', '2.5')
        .style('paint-order', 'stroke fill')
        .text(country.name);
    }
  }

  function markFound(country) {
    found.add(country.id);
    d3.select(`#${cpId(country.id)}`).classed('found', true);
    addMapLabel(country, foundLabelsG, '#4ade80');

    const container = document.getElementById('found-tags');
    const tag = document.createElement('span');
    tag.className   = 'tag';
    tag.textContent = country.name;
    const existing  = [...container.querySelectorAll('.tag')];
    const after     = existing.find(t => t.textContent > country.name);
    container.insertBefore(tag, after ?? null);

    document.getElementById('found-count').textContent = found.size;
    document.getElementById('found-section').style.display = 'block';

    updateProgress();
    setFeedback(`✓ ${country.name}!`, '#4ade80');

    if (found.size === TOTAL) {
      const banner = document.getElementById('win-banner');
      banner.textContent = winMsg;
      banner.style.display = 'block';
      endGame();
    }
  }

  function endGame() {
    gameOver = true;
    input.disabled = true;
    document.getElementById('give-up-btn').style.display = 'none';
    document.getElementById('restart-btn').style.display = 'block';
  }

  function pulse(cls) {
    input.classList.add(cls);
    setTimeout(() => input.classList.remove(cls), 400);
  }

  // ── Persistent event listeners ────────────────────────────────────────────

  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const c = lookup.get(val);
    if (c && !found.has(c.id)) {
      markFound(c);
      input.value = '';
      input.classList.remove('wrong');
      input.classList.add('correct');
      setTimeout(() => input.classList.remove('correct'), 500);
    }
  });

  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const c = lookup.get(val);
    if (c && !found.has(c.id)) {
      markFound(c);
      input.value = '';
      input.classList.add('correct');
      setTimeout(() => input.classList.remove('correct'), 500);
    } else if (c && found.has(c.id)) {
      setFeedback(`Already got ${c.name}!`, '#fbbf24');
      pulse('wrong');
    } else {
      setFeedback(`Not a ${regionLabel} country — keep trying!`, '#f87171');
      pulse('wrong');
    }
  });

  document.getElementById('give-up-btn').addEventListener('click', () => {
    if (gameOver) return;
    const missed = COUNTRIES_LIST.filter(c => !found.has(c.id));
    missed.sort((a, b) => a.name.localeCompare(b.name));
    missed.forEach(c => {
      d3.select(`#${cpId(c.id)}`).classed('missed', true);
      addMapLabel(c, missedLabelsG, '#fff');
    });
    const container = document.getElementById('missed-tags');
    missed.forEach(c => {
      const tag = document.createElement('span');
      tag.className   = 'missed-tag';
      tag.textContent = c.name;
      container.appendChild(tag);
    });
    document.getElementById('missed-count').textContent = missed.length;
    document.getElementById('missed-section').style.display = 'block';
    setFeedback(`Game over — you got ${found.size} / ${TOTAL}`, '#94a3b8');
    endGame();
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    const activeRegion = document.querySelector('.tab-btn.active').dataset.region;
    initQuiz(activeRegion);
  });

  // ── Tab switching ─────────────────────────────────────────────────────────

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      initQuiz(btn.dataset.region);
    });
  });

  // ── initQuiz ──────────────────────────────────────────────────────────────

  function initQuiz(regionKey) {
    const config = CONFIGS[regionKey];
    const myVersion = ++quizVersion;

    // Update shared state
    COUNTRIES_LIST = config.countries;
    TOTAL          = config.total;
    SMALL_DEF_CUR  = config.smallDef;
    SMALL_IDS      = new Set(config.smallDef.map(s => s.id));
    regionLabel    = config.regionLabel;
    winMsg         = config.winMsg;
    found          = new Set();
    gameOver       = false;
    featureMap     = new Map();

    lookup = new Map();
    COUNTRIES_LIST.forEach(c => {
      lookup.set(c.name.toLowerCase(), c);
      (c.aliases || []).forEach(a => lookup.set(a.toLowerCase(), c));
    });

    // Reset UI
    document.getElementById('score-num').textContent     = 0;
    document.getElementById('score-den').textContent     = TOTAL;
    document.getElementById('prog-fill').style.width     = '0%';
    document.getElementById('prog-label').textContent    = '0%';
    document.getElementById('feedback').textContent      = '';
    document.getElementById('win-banner').style.display  = 'none';
    document.getElementById('win-banner').textContent    = '';
    document.getElementById('found-section').style.display  = 'none';
    document.getElementById('found-count').textContent   = 0;
    document.getElementById('found-tags').innerHTML      = '';
    document.getElementById('missed-section').style.display = 'none';
    document.getElementById('missed-count').textContent  = 0;
    document.getElementById('missed-tags').innerHTML     = '';
    document.getElementById('give-up-btn').style.display = '';
    document.getElementById('restart-btn').style.display = 'none';
    input.disabled = false;
    input.value    = '';
    input.classList.remove('correct', 'wrong');

    // Rebuild SVG
    const svgEl = d3.select('#map');
    svgEl.on('.zoom', null);
    svgEl.selectAll('*').remove();
    svgEl.append('rect').attr('width', W).attr('height', H).attr('fill', '#0c1f35');

    proj    = d3.geoMercator().center(config.projCenter).scale(config.projScale).translate([W / 2, H / 2]);
    geoPath = d3.geoPath().projection(proj);

    const zoomG = svgEl.append('g');

    zoomG.append('g').append('path')
      .datum(d3.geoGraticule()())
      .attr('d', geoPath)
      .attr('fill', 'none')
      .attr('stroke', '#112236')
      .attr('stroke-width', 0.4);

    const countriesG = zoomG.append('g');
    calloutG      = zoomG.append('g');
    foundLabelsG  = zoomG.append('g');
    missedLabelsG = zoomG.append('g');

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on('zoom', ({ transform }) => zoomG.attr('transform', transform));
    svgEl.call(zoom);
    svgEl.call(zoom.transform, d3.zoomIdentity);

    // Draw small-country callout indicators
    SMALL_DEF_CUR.forEach(sc => {
      const [px, py] = proj([sc.lon, sc.lat]);
      const lx = px + sc.dx, ly = py + sc.dy;
      const g = calloutG.append('g').attr('id', `callout-${safeId(sc.id)}`);
      g.append('line')
        .attr('x1', px).attr('y1', py).attr('x2', lx).attr('y2', ly)
        .attr('stroke', '#ffffff').attr('stroke-width', 2);
      g.append('circle')
        .attr('cx', px).attr('cy', py).attr('r', 3).attr('fill', '#ffffff');
    });

    const idSet = new Set(COUNTRIES_LIST.map(c => c.id));

    // Load TopoJSON (cached by browser after first fetch)
    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(world => {
        if (quizVersion !== myVersion) return;
        const features        = topojson.feature(world, world.objects.countries).features;
        const regionFeatures  = features.filter(f => idSet.has(+f.id));
        regionFeatures.forEach(f => featureMap.set(+f.id, f));
        countriesG
          .selectAll('path')
          .data(regionFeatures)
          .join('path')
          .attr('class', 'country-path')
          .attr('id', d => cpId(+d.id))
          .attr('d', geoPath);
      })
      .catch(() => {
        if (quizVersion !== myVersion) return;
        document.getElementById('map-wrap').innerHTML =
          '<p style="color:#f87171;text-align:center;padding:40px;font-size:1rem">' +
          'Could not load map data — check your internet connection and refresh.</p>';
      });

    input.focus();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  initQuiz('europe');

})();
</script>
</body>
</html>
